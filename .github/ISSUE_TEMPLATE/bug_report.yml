# .github/ISSUE_TEMPLATE/bug_report.yml
name: 🐛 Bug 报告
description: 提交一个 Bug 以帮助我们改进
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 请简要描述发生了什么，以及你期望的行为。
      placeholder: 发生了什么？你期望什么？
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: 复现步骤
      description: 请提供逐步复现此问题的步骤。
      placeholder: |
        1. 打开 '...'
        2. 点击 '...'
        3. 看到错误
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: 软件版本
      description: 请填写受影响的软件及版本号。
      placeholder: "例如：大众点评 11.28.3"
    validations:
      required: true

  - type: input
    id: tool-version
    attributes:
      label: 工具版本
      description: 请填写所用工具及版本号。
      placeholder: "例如：Quantumult X 1.4.1 / Surge 5.12.0"
    validations:
      required: true

  - type: input
    id: system-version
    attributes:
      label: 系统版本
      description: 请填写操作系统及版本号。
      placeholder: "例如：iOS 17.5 / macOS 14.5"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 相关日志及图片
      description: 可选，粘贴相关日志输出及图片。
      render: shell
    validations:
      required: false